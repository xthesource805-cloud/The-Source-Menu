<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0c0d0e" />
  <title>The Source Reserve Experience</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg-main: #0c0d0e;
      --bg-card: #151719;
      --bg-card-border: #24272b;
      --gold: #d4af37;
      --gold-dim: #997f26;
      --text-main: #f1f2f3;
      --text-muted: #8e959e;
      --pill-bg: #22262b;
      --wa-green: #25d366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 90px; }

    header {
      background: linear-gradient(180deg, #181b1e 0%, var(--bg-main) 100%);
      padding: 24px 20px 16px;
      text-align: center;
      border-bottom: 1px solid var(--bg-card-border);
    }
    header h1 { font-size: 1.5rem; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; }
    header p { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; letter-spacing: 1px; }

    .bundle-banner {
      background: #1b1a13;
      border: 1px solid var(--gold);
      border-radius: 8px;
      margin: 16px auto;
      max-width: 900px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .bundle-title { font-weight: bold; color: var(--gold); font-size: 0.95rem; }
    .bundle-sub { font-size: 0.8rem; color: var(--text-muted); }
    .bundle-price { font-size: 1.25rem; font-weight: bold; color: #fff; }

    .controls {
      max-width: 900px;
      margin: 16px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .search-bar input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      border-radius: 6px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.95rem;
    }
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-btn.active {
      background: var(--gold);
      color: #000;
      font-weight: bold;
      border-color: var(--gold);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .card.featured {
      border-color: var(--gold-dim);
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.15);
    }
    .featured-tag {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--gold);
      color: #000;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .card-category { font-size: 0.7rem; color: var(--gold); text-transform: uppercase; margin-bottom: 4px; }
    .card-title { font-size: 1.15rem; font-weight: bold; margin-bottom: 6px; }
    .badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 12px;
      width: fit-content;
      text-transform: uppercase;
    }
    .badge-hybrid { background: #392b47; color: #c499f5; }
    .badge-indica { background: #22374a; color: #7cb8eb; }
    .badge-sativa { background: #45341f; color: #ebb267; }
    .badge-craft { background: #233e2e; color: #76d498; }

    .meta-group { margin-bottom: 8px; }
    .meta-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .pills { display: flex; flex-wrap: wrap; gap: 4px; }
    .pill {
      background: var(--pill-bg);
      font-size: 0.7rem;
      color: #d1d5db;
      padding: 3px 8px;
      border-radius: 12px;
    }

    .size-selector {
      margin-top: 12px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .size-btn {
      background: #1c1f24;
      border: 1px solid var(--bg-card-border);
      color: var(--text-muted);
      padding: 5px 10px;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .size-btn.active {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
      font-weight: bold;
    }

    .card-footer {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--bg-card-border);
      padding-top: 12px;
    }
    .card-price { font-size: 0.95rem; font-weight: 700; color: var(--gold); }
    .add-btn {
      background: #252a30;
      color: #fff;
      border: 1px solid var(--bg-card-border);
      padding: 6px 14px;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .add-btn:hover { background: var(--gold); color: #000; }

    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #141618;
      border-top: 1px solid var(--bg-card-border);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .bar-total { font-size: 1rem; font-weight: bold; }
    .view-cart-btn {
      background: var(--gold);
      color: #000;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .cart-drawer {
      position: fixed;
      top: 0; right: -100%; bottom: 0;
      width: 100%;
      max-width: 400px;
      background: #151719;
      box-shadow: -4px 0 16px rgba(0,0,0,0.6);
      transition: right 0.3s ease;
      z-index: 200;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }
    .cart-drawer.open { right: 0; }
    .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bg-card-border); padding-bottom: 12px; }
    .close-btn { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; }
    .cart-items { max-height: 180px; overflow-y: auto; margin: 12px 0; display: flex; flex-direction: column; gap: 8px; }
    .cart-item { display: flex; justify-content: space-between; background: #1b1e22; padding: 10px; border-radius: 6px; font-size: 0.85rem; }

    .checkout-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--bg-card-border);
    }
    .checkout-input {
      background: #1e2226;
      border: 1px solid var(--bg-card-border);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .whatsapp-btn {
      background: var(--wa-green);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 8px;
    }
    .whatsapp-btn:hover { background: #1ebe57; }
  </style>
</head>
<body>

  <header>
    <h1>The Source</h1>
    <p>Reserve Experience &bull; Curated Collection</p>
  </header>

  <div class="bundle-banner">
    <div>
      <div class="bundle-title">Limited-Time Reserve Bundle</div>
      <div class="bundle-sub">Indoor Soil Ounce + 2G Disposable + 2.25G Infused Blunt</div>
    </div>
    <div class="bundle-price">$120 <span style="font-size:0.75rem; color:var(--text-muted); text-decoration:line-through;">$150</span></div>
  </div>

  <div class="controls">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search strains, flavors, effects..." oninput="renderItems()"/>
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="setCategory('All', this)">All</button>
      <button class="filter-btn" onclick="setCategory('Signature Indoor Soil', this)">Indoor Soil</button>
      <button class="filter-btn" onclick="setCategory('Hydro Organic Reserve', this)">Hydro Organic</button>
      <button class="filter-btn" onclick="setCategory('Hydro Select Collection', this)">Hydro Select</button>
      <button class="filter-btn" onclick="setCategory('Light Dep Collection', this)">Light Dep</button>
      <button class="filter-btn" onclick="setCategory('Infused Blunts', this)">Blunts</button>
      <button class="filter-btn" onclick="setCategory('2G Disposables', this)">Disposables</button>
      <button class="filter-btn" onclick="setCategory('Concentrates', this)">Concentrates</button>
    </div>
  </div>

  <div class="container" id="menuContainer"></div>

  <div class="bottom-bar">
    <div>
      <div style="font-size:0.75rem; color:var(--text-muted);">Current Tally</div>
      <div class="bar-total" id="barTotal">$0.00</div>
    </div>
    <button class="view-cart-btn" onclick="toggleCart()">Order Tally (<span id="cartCount">0</span>)</button>
  </div>

  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>Your Order Tally</h3>
      <button class="close-btn" onclick="toggleCart()">&times;</button>
    </div>

    <div class="cart-items" id="cartItems"></div>
    <div id="bundleStatus" style="font-size:0.8rem; margin-bottom:8px; color:var(--gold);"></div>

    <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.1rem; margin-bottom:12px;">
      <span>Total:</span>
      <span id="drawerTotal">$0.00</span>
    </div>

    <div class="checkout-form">
      <input type="text" id="custName" class="checkout-input" placeholder="Full Name *" required />
      <input type="tel" id="custPhone" class="checkout-input" placeholder="Callback Phone Number *" required />
      <input type="text" id="custAddress" class="checkout-input" placeholder="Delivery Address & Apt/Unit *" required />

      <select id="custPayment" class="checkout-input" required>
        <option value="" disabled selected>Select Payment Method *</option>
        <option value="Cash on Delivery">Cash on Delivery</option>
        <option value="Zelle">Zelle</option>
        <option value="Cash App">Cash App</option>
        <option value="Venmo">Venmo</option>
      </select>

      <textarea id="custNotes" class="checkout-input" placeholder="Delivery instructions (gate code, call on arrival, etc.)" rows="2" style="resize:none;"></textarea>

      <button class="whatsapp-btn" onclick="sendOrderViaWhatsApp()">
        <span>Order via WhatsApp</span>
        <span style="font-size: 0.8rem; font-weight: normal; opacity: 0.9;">Direct to (820) 212-0615</span>
      </button>
      <div style="text-align: center; font-size: 0.7rem; color: var(--text-muted); margin-top: 4px;">
        Dispatches order instantly via WhatsApp
      </div>
    </div>
  </div>

      // Hydro Organic Reserve ($40 3.5G | $120 Half | $180 Ounce)
      { id: 11, category: "Hydro Organic Reserve", name: "Frosted Doughnuts", type: "Hybrid", featured: true, flavors: ["Vanilla frosting", "Sweet dough"], effects: ["Calm", "Relaxing", "Balanced"], baseType: "hydro-org", options: [{ label: "3.5G", price: 40 }, { label: "1/2 Oz", price: 120 }, { label: "1 Oz", price: 180 }] },

      // Hydro Select Collection ($30 3.5G | $100 Half | $140 Ounce)
      { id: 15, category: "Hydro Select Collection", name: "Grapeology", type: "Indica Dom", featured: true, flavors: ["Sweet grape", "Candy fruit"], effects: ["Calm", "Relaxing"], baseType: "hydro-sel", options: [{ label: "3.5G", price: 30 }, { label: "1/2 Oz", price: 100 }, { label: "1 Oz", price: 140 }] },

      { id: 21, category: "Light Dep Collection", name: "Bubble Gum x Horchata", type: "Craft", featured: true, flavors: ["Bubble gum", "Cream", "Cinnamon"], effects: ["Balanced", "Relaxing"], baseType: "light-dep", options: [{ label: "1/2 Oz", price: 60 }, { label: "1 Oz", price: 80 }] },

      { id: 27, category: "2G Disposables", name: "Muha Bubble Gum Burst", type: "Sativa", featured: false, flavors: ["Bubble gum"], effects: ["Energetic", "Uplifting"], baseType: "disposable", options: [{ label: "2G", price: 30 }] },
      { id: 28, category: "2G Disposables", name: "Muha Habibi", type: "Sativa", featured: false, flavors: ["Bright citrus"], effects: ["Energetic", "Focused"], baseType: "disposable", options: [{ label: "2G", price: 30 }] },
      { id: 29, category: "2G Disposables", name: "Muha Pineapple Paradise", type: "Hybrid", featured: false, flavors: ["Pineapple"], effects: ["Balanced", "Euphoric"], baseType: "disposable", options: [{ label: "2G", price: 30 }] },

      // Concentrates ($100 Ounce)
      { id: 30, category: "Concentrates", name: "Motor Breath with Crystals", type: "Hybrid Wax", featured: true, flavors: ["Diesel", "Earth", "Fuel"], effects: ["Potent", "Relaxing"], baseType: "wax", options: [{ label: "1 Oz", price: 100 }] }
    ];

    let activeCategory = "All";
    let selectedOptions = {}; // Tracks selected size per item ID
    let cart = [];

    // Initialize default selections to the first option
    menuData.forEach(item => {
      selectedOptions[item.id] = 0;
    });

    function setCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderItems();
    }

    function selectSize(itemId, optIndex) {
      selectedOptions[itemId] = optIndex;
      const item = menuData.find(i => i.id === itemId);
      const chosen = item.options[optIndex];
      
      // Update displayed price on card
      document.getElementById(`price-${itemId}`).innerText = `$${chosen.price}`;
      
      // Update active button state
      const buttons = document.querySelectorAll(`.size-btn-${itemId}`);
      buttons.forEach((b, idx) => {
        b.classList.toggle('active', idx === optIndex);
      });
    }

    function getBadgeClass(type) {
      const t = type.toLowerCase();
      if (t.includes('indica')) return 'badge-indica';
      if (t.includes('sativa')) return 'badge-sativa';
      if (t.includes('craft')) return 'badge-craft';
      return 'badge-hybrid';
    }

    function renderItems() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('menuContainer');
      container.innerHTML = '';

      const filtered = menuData.filter(item => {
        const matchesCategory = activeCategory === "All" || item.category === activeCategory;
        const matchesSearch = item.name.toLowerCase().includes(query) ||
          item.flavors.some(f => f.toLowerCase().includes(query)) ||
          item.effects.some(e => e.toLowerCase().includes(query)) ||
          item.type.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });

      filtered.forEach(item => {
        const currentOptIdx = selectedOptions[item.id] || 0;
        const activeOption = item.options[currentOptIdx];

        const card = document.createElement('div');
        card.className = `card ${item.featured ? 'featured' : ''}`;
        card.innerHTML = `
          ${item.featured ? '<div class="featured-tag">FEATURED</div>' : ''}
          <div>
            <div class="card-category">${item.category}</div>
            <div class="card-title">${item.name}</div>
            <div class="badge ${getBadgeClass(item.type)}">${item.type}</div>
            <div class="meta-group">
              <div class="meta-label">Flavor</div>
              <div class="pills">${item.flavors.map(f => `<span class="pill">${f}</span>`).join('')}</div>
            </div>
            <div class="meta-group">
              <div class="meta-label">Effect</div>
              <div class="pills">${item.effects.map(e => `<span class="pill">${e}</span>`).join('')}</div>
            </div>
            
            <div class="size-selector">
              ${item.options.map((opt, idx) => `
                <button type="button" 
                  class="size-btn size-btn-${item.id}${idx === currentOptIdx ? 'active' : ''}" 
                  onclick="selectSize(${item.id},${idx})">
                  ${opt.label}
                </button>
              `).join('')}
            </div>
          </div>
          
          <div class="card-footer">
            <span class="card-price" id="price-${item.id}">$${activeOption.price}</span>
            <button class="add-btn" onclick="addToCart(${item.id})">+ Add</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function addToCart(id) {
      const item = menuData.find(i => i.id === id);
      const chosenOpt = item.options[selectedOptions[id] || 0];

      cart.push({
        id: item.id,
        name: item.name,
        category: item.category,
        baseType: item.baseType,
        size: chosenOpt.label,
        price: chosenOpt.price,
        isOz: chosenOpt.isOz === true
      });

      updateCartDisplay();
    }

    function calculateCartTotal() {
      // Reserve Bundle applies only to Soil Ounces (1 Oz), Disposables, and Blunts
      const soilOzCount = cart.filter(i => i.baseType === 'soil' && i.isOz).length;
      const dispCount = cart.filter(i => i.baseType === 'disposable').length;
      const bluntCount = cart.filter(i => i.baseType === 'blunt').length;

      const bundlesPossible = Math.min(soilOzCount, dispCount, bluntCount);

      const rawTotal = cart.reduce((sum, item) => sum + item.price, 0);
      const discount = bundlesPossible * 30; // Bundle value $150 down to $120
      const finalTotal = rawTotal - discount;

      return { finalTotal, bundlesPossible };
    }

    function updateCartDisplay() {
      document.getElementById('cartCount').innerText = cart.length;

      const { finalTotal, bundlesPossible } = calculateCartTotal();
      const formattedTotal = `$${finalTotal.toFixed(2)}`;
      document.getElementById('barTotal').innerText = formattedTotal;
      document.getElementById('drawerTotal').innerText = formattedTotal;

      const status = document.getElementById('bundleStatus');
      if (bundlesPossible > 0) {
        status.innerText = `🎉 ${bundlesPossible}x Reserve Bundle applied (-$${bundlesPossible * 30})!`;
      } else {
        status.innerText = '';
      }

      const list = document.getElementById('cartItems');
      list.innerHTML = cart.map((item, idx) => `
        <div class="cart-item">
          <div>
            <div>${item.name} (${item.size})</div>
            <div style="font-size:0.75rem; color:var(--text-muted);">$${item.price}</div>
          </div>
          <button style="background:none; border:none; color:#e06c75; cursor:pointer;" onclick="removeFromCart(${idx})">&times;</button>
        </div>
      `).join('');
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartDisplay();
    }

    function toggleCart() {
      document.getElementById('cartDrawer').classList.toggle('open');
    }

    function sendOrderViaWhatsApp() {
      if (cart.length === 0) return alert('Your tally is empty.');

      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const payment = document.getElementById('custPayment').value;
      const notes = document.getElementById('custNotes').value.trim();

      if (!name || !phone || !address || !payment) {
        return alert('Please fill in your Name, Phone Number, Delivery Address, and Payment Method.');
      }

      const { finalTotal, bundlesPossible } = calculateCartTotal();
      const itemsList = cart.map(i => `• ${i.name} (${i.size}) - $${i.price}`).join('\n');

      let orderText = `*THE SOURCE RESERVE ORDER*\n\n`;
      orderText += `*Name:* ${name}\n`;
      orderText += `*Phone:* ${phone}\n`;
      orderText += `*Delivery Address:* ${address}\n`;
      orderText += `*Payment:* ${payment}\n`;
      if (notes) orderText += `*Notes:* ${notes}\n`;
      orderText += `\n*Items:*\n${itemsList}\n`;
      if (bundlesPossible > 0) {
        orderText += `\n*Reserve Bundle Discount:* ${bundlesPossible}x (-$${bundlesPossible * 30})\n`;
      }
      orderText += `\n*Total Due:* $${finalTotal.toFixed(2)}`;

      const waPhone = "18202120615";
      const waURL = `https://wa.me/${waPhone}?text=${encodeURIComponent(orderText)}`;
      window.open(waURL, '_blank');
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered:', reg.scope))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }

    renderItems();
  </script>
</body>
</html>
